<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 210, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glowing Lines Effects -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffb199" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0844" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #00d2ff;
      letter-spacing: 0.5px;
    }
    .badge {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a0aec0;
    }
    
    /* CSS Animations for Dynamic Wave & Rig Pulse */
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-60px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    @keyframes dashOffset {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-wave {
      animation: waveMove 10s ease-in-out infinite;
    }
    .animated-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .animated-path {
      stroke-dasharray: 20, 10;
      animation: dashOffset 30s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Dynamic Animated Graphic Elements in Background (Depth Layer) -->
  <g opacity="0.35" class="animated-pulse">
    <!-- Subsurface Seismic Waves / Real-time Data Curves -->
    <path class="animated-wave" d="M -100 220 Q 150 140 400 230 T 900 180 T 1400 250" fill="none" stroke="url(#lineGrad1)" stroke-width="4" filter="url(#glow)" />
    <path class="animated-wave" d="M -100 250 Q 200 290 550 200 T 1050 260 T 1400 190" fill="none" stroke="url(#lineGrad2)" stroke-width="3" filter="url(#glow)" />
    <path class="animated-path" d="M 0 100 L 1200 100" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1.5" />
    <path class="animated-path" d="M 0 260 L 1200 260" stroke="rgba(255, 8, 68, 0.15)" stroke-width="1.5" />
  </g>

  <!-- Drilling Derrick Technical Schematic Watermark (Right Aligned) -->
  <g transform="translate(950, 40)" opacity="0.2" stroke="#00f2fe" stroke-width="2" fill="none">
    <!-- Derrick Structure -->
    <polygon points="100,200 130,20 170,20 200,200" />
    <line x1="112" y1="130" x2="188" y2="130" />
    <line x1="120" y1="80" x2="180" y2="80" />
    <line x1="100" y1="200" x2="180" y2="80" />
    <line x1="200" y1="200" x2="120" y2="80" />
    <line x1="112" y1="130" x2="170" y2="20" />
    <line x1="188" y1="130" x2="130" y2="20" />
    <!-- Drill Pipe Line -->
    <line x1="150" y1="20" x2="150" y2="240" stroke="#ff0844" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Foreground Main Content (Title, Subtitle, Badges) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
      <text x="140" y="19" text-anchor="middle" class="badge">⚙️ DRILLING OPERATIONS MANAGEMENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Drilling Operations Management</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Curated SaaS Platforms &amp; Open-Source Tools for Well Planning &amp; Real-Time Analytics</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="80" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0">🎯 Well Planning</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="180" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="265" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0">⚡ WITSML &amp; Real-Time</text>

      <!-- Tag 3 -->
      <rect x="370" y="0" width="170" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="455" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0">📊 NPT &amp; ROP Analytics</text>
    </g>
  </g>
</svg>

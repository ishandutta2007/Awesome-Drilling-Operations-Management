<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b1329"/><stop offset="50%" stop-color="#101f42"/><stop offset="100%" stop-color="#050b18"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#00d2ff" stroke-opacity=".05" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><linearGradient id="lineGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/><stop offset="50%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity="0"/></linearGradient><linearGradient id="lineGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ff0844" stop-opacity="0"/><stop offset="50%" stop-color="#ffb199" stop-opacity=".8"/><stop offset="100%" stop-color="#ff0844" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes waveMove{0%{transform:translateX(0)}50%{transform:translateX(-40px)}}@keyframes pulseGlow{0%{opacity:.3}50%{opacity:.7}}.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:38px;fill:#fff}.subtitle{font-weight:400;font-size:18px;fill:#00d2ff}.badge,.subtitle,.tag-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge{font-weight:600;font-size:12px;fill:#00d2ff;letter-spacing:1px}.tag-text{font-size:13px;fill:#e2e8f0}.animated-wave{animation:waveMove 10s ease-in-out infinite}.animated-pulse{animation:pulseGlow 4s ease-in-out infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)"/><rect width="1200" height="300" fill="url(#grid)"/><g class="animated-pulse" opacity=".4"><path fill="none" stroke="url(#lineGrad1)" stroke-width="4" d="M -100 220 Q 150 140 400 230 T 900 180 T 1400 250" class="animated-wave" filter="url(#glow)"/><path fill="none" stroke="url(#lineGrad2)" stroke-width="3" d="M -100 250 Q 200 290 550 200 T 1050 260 T 1400 190" class="animated-wave" filter="url(#glow)"/><path stroke="#00f2fe" stroke-dasharray="15 10" stroke-opacity=".15" stroke-width="1.5" d="M 0 100 L 1200 100"/><path stroke="#ff0844" stroke-dasharray="15 10" stroke-opacity=".15" stroke-width="1.5" d="M 0 260 L 1200 260"/></g><g fill="none" stroke="#00f2fe" stroke-width="2" opacity=".25" transform="translate(950, 40)"><polygon points="100 200 130 20 170 20 200 200"/><line x1="112" x2="188" y1="130" y2="130"/><line x1="120" x2="180" y1="80" y2="80"/><line x1="100" x2="180" y1="200" y2="80"/><line x1="200" x2="120" y1="200" y2="80"/><line x1="112" x2="170" y1="130" y2="20"/><line x1="188" x2="130" y1="130" y2="20"/><line x1="150" x2="150" y1="20" y2="240" stroke="#ff0844" stroke-width="3" filter="url(#glow)"/></g><g><g transform="translate(60, 0) translate(0, 45)"><rect width="280" height="30" x="0" y="0" fill="#00d2ff" fill-opacity=".1" stroke="#00d2ff" stroke-opacity=".3" stroke-width="1" rx="15"/><text x="140" y="19" class="badge" text-anchor="middle">DRILLING OPERATIONS MANAGEMENT</text></g><text x="0" y="125" class="title" transform="translate(60, 0)">Awesome Drilling Operations Management</text><text x="0" y="165" class="subtitle" transform="translate(60, 0)">Curated SaaS Platforms &amp; Open-Source Tools for Well Planning &amp; Real-Time Analytics</text><g transform="translate(60, 0) translate(0, 210)"><rect width="150" height="32" x="0" y="0" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".15" rx="6"/><text x="75" y="20" class="tag-text" text-anchor="middle">Well Planning</text><rect width="180" height="32" x="165" y="0" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".15" rx="6"/><t